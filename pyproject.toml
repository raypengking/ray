[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-storyboard"
version = "0.1.0"
description = "Storyboard generator that turns Chinese fiction into scripts and Nano Banana renders."
authors = [{ name = "Ray" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "typer>=0.9",
    "Pillow>=10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ray-storyboard = "ray.cli:app"
